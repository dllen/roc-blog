<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="auto" role="img" aria-label="Naive vs PagedAttention Fragmentation Comparison">
  <title>Naive vs PagedAttention 碎片对比</title>
  <desc>对比 Naive KV Cache 预分配策略（60-80% 碎片浪费）与 PagedAttention block 策略（≤4% 碎片）的内存使用效率</desc>

  <defs>
    <linearGradient id="naiveBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1F2E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="wastePattern" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#E04E3D" opacity="0.3"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#E04E3D" stroke-width="1.5" opacity="0.6"/>
    </pattern>
    <pattern id="wastePattern2" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#E04E3D" opacity="0.2"/>
      <line x1="0" y1="6" x2="6" y2="0" stroke="#E04E3D" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="500" fill="url(#naiveBg)"/>

  <!-- 标题 -->
  <text x="450" y="42" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#F5F0E8">Naive vs PagedAttention 内部碎片对比</text>

  <!-- ===== 左半边：Naive ===== -->
  <g transform="translate(40, 70)">
    <!-- 标签 -->
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#2D3548" stroke="#E04E3D" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="bold" fill="#E04E3D">Naive 预分配</text>

    <!-- 长条容器 -->
    <g transform="translate(0, 50)">
      <!-- 背景（max 分配） -->
      <rect x="0" y="0" width="380" height="80" rx="6" fill="#2D3548" stroke="#6B7280" stroke-width="1.5"/>

      <!-- 已使用区域 128/1024 -->
      <rect x="2" y="2" width="48" height="76" rx="4" fill="#9CA9BD"/>
      <text x="26" y="44" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="bold" fill="#1A1F2E">128</text>

      <!-- 浪费区域（剩余 896） -->
      <rect x="50" y="2" width="328" height="76" rx="0" fill="url(#wastePattern)"/>
      <text x="214" y="44" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#E04E3D" font-weight="bold">浪费 896 / 1024</text>

      <!-- 上下标注 -->
      <text x="26" y="100" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9CA9BD">已用 128</text>
      <text x="214" y="100" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#E04E3D">内部碎片 87.5%</text>
    </g>

    <!-- 显存账说明 -->
    <g transform="translate(0, 165)">
      <text x="0" y="0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9CA9BD">H100 80GB · LLaMA-2-13B FP16</text>
      <text x="0" y="20" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6B7280">max_seq_len = 4096</text>
      <text x="0" y="38" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6B7280">实际使用：~200 tokens</text>
    </g>

    <!-- 大数字 -->
    <text x="190" y="270" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="52" font-weight="bold" fill="#E04E3D">60-80%</text>
    <text x="190" y="295" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#F5F0E8">总浪费</text>

    <!-- 问题说明 -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#E04E3D">✗ 预分配 max_seq_len</text>
      <text x="0" y="20" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#E04E3D">✗ 内部碎片 87.5%</text>
      <text x="0" y="40" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#E04E3D">✗ 外部碎片（allocator 碎化）</text>
      <text x="0" y="60" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#E04E3D">✗ 并发 ~4 req / H100</text>
    </g>
  </g>

  <!-- ===== 中间大箭头 ===== -->
  <g transform="translate(450, 220)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#F5F0E8" stroke-width="4" stroke-linecap="round"/>
    <polygon points="30,-10 50,0 30,10" fill="#F5F0E8"/>
    <text x="0" y="-20" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="bold" fill="#F5F0E8">60-80%</text>
    <text x="0" y="35" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="20" font-weight="bold" fill="#F59E42">→ ≤4%</text>
  </g>

  <!-- ===== 右半边：PagedAttention ===== -->
  <g transform="translate(490, 70)">
    <!-- 标签 -->
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#2D3548" stroke="#F59E42" stroke-width="1.5"/>
    <text x="80" y="20" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="bold" fill="#F59E42">PagedAttention</text>

    <!-- Block 方块们 -->
    <g transform="translate(0, 50)">
      <!-- Block 0 -->
      <rect x="0" y="0" width="36" height="36" rx="4" fill="#F59E42"/>
      <text x="18" y="22" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#1A1F2E">16</text>

      <!-- Block 1 -->
      <rect x="40" y="0" width="36" height="36" rx="4" fill="#F59E42"/>
      <text x="58" y="22" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#1A1F2E">16</text>

      <!-- Block 2 -->
      <rect x="80" y="0" width="36" height="36" rx="4" fill="#F59E42"/>
      <text x="98" y="22" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#1A1F2E">16</text>

      <!-- Block 3 -->
      <rect x="120" y="0" width="36" height="36" rx="4" fill="#F59E42"/>
      <text x="138" y="22" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#1A1F2E">16</text>

      <!-- Block 4 -->
      <rect x="160" y="0" width="36" height="36" rx="4" fill="#F59E42"/>
      <text x="178" y="22" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#1A1F2E">16</text>

      <!-- Block 5 -->
      <rect x="200" y="0" width="36" height="36" rx="4" fill="#F59E42"/>
      <text x="218" y="22" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#1A1F2E">16</text>

      <!-- Block 6 -->
      <rect x="240" y="0" width="36" height="36" rx="4" fill="#F59E42"/>
      <text x="258" y="22" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#1A1F2E">16</text>

      <!-- Block 7 -->
      <rect x="280" y="0" width="36" height="36" rx="4" fill="#F59E42"/>
      <text x="298" y="22" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#1A1F2E">16</text>

      <!-- Block 8 -->
      <rect x="320" y="0" width="36" height="36" rx="4" fill="#F59E42"/>
      <text x="338" y="22" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#1A1F2E">16</text>

      <!-- Block 9 - 部分填充（3/16） -->
      <rect x="360" y="0" width="36" height="36" rx="4" fill="#2D3548" stroke="#F59E42" stroke-width="1.5"/>
      <!-- 填充 3/16 -->
      <rect x="362" y="30" width="32" height="4" rx="2" fill="#F59E42"/>
      <text x="378" y="22" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9CA9BD">3/16</text>
    </g>

    <!-- Block 标注 -->
    <text x="180" y="105" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9CA9BD">Block 0-8: 满块 · Block 9: 3/16 填充</text>

    <!-- 浪费分析 -->
    <g transform="translate(0, 125)">
      <text x="0" y="0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#9CA9BD">H100 80GB · LLaMA-2-13B FP16</text>
      <text x="0" y="20" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6B7280">B = 16 tokens/block</text>
      <text x="0" y="38" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6B7280">每请求最多浪费：B-1 = 15 tokens</text>
      <text x="0" y="56" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6B7280">多请求混合 aggregate ≈ 4%</text>
    </g>

    <!-- 大数字 -->
    <text x="190" y="235" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="52" font-weight="bold" fill="#F59E42">≤4%</text>
    <text x="190" y="260" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#F5F0E8">总浪费</text>

    <!-- 优点说明 -->
    <g transform="translate(0, 275)">
      <text x="0" y="0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#F59E42">✓ 按需分配（just-in-time）</text>
      <text x="0" y="20" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#F59E42">✓ 内部碎片 ≤ 1 block</text>
      <text x="0" y="40" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#F59E42">✓ 外部碎片接近 0</text>
      <text x="0" y="60" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#F59E42">✓ 并发 ~16 req / H100</text>
    </g>
  </g>

  <!-- ===== 底部信息条 ===== -->
  <rect x="0" y="450" width="900" height="50" fill="#2D3548"/>
  <text x="450" y="478" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#9CA9BD">H100 80GB · LLaMA-2-13B FP16 · 4096 ctx · B=16 tokens/block</text>

</svg>
