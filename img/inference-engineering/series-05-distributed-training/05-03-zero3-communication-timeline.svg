<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="auto" role="img">
  <title>ZeRO-3 通信时间线 Gantt 图</title>
  <desc>ZeRO-3通信时间线 — FWD+BWD 1 iteration，展示prefetch如何隐藏通信延迟</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F5F0E8"/>
    </marker>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1F2E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="gridPat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2D3548" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="22" font-weight="700" fill="#F5F0E8" letter-spacing="1">ZeRO-3 通信时间线 · FWD+BWD 1 iteration</text>
  <line x1="80" y1="52" x2="820" y2="52" stroke="#2D3548" stroke-width="1"/>

  <!-- ====== TIME AXIS ====== -->
  <!-- axis base line -->
  <line x1="60" y1="440" x2="840" y2="440" stroke="#9CA9BD" stroke-width="1"/>

  <!-- major ticks and labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA9BD">
    <line x1="60" y1="435" x2="60" y2="445" stroke="#9CA9BD" stroke-width="1.5"/>
    <text x="60" y="458" text-anchor="middle">0</text>

    <line x1="157" y1="435" x2="157" y2="445" stroke="#9CA9BD" stroke-width="1.5"/>
    <text x="157" y="458" text-anchor="middle">20</text>

    <line x1="255" y1="435" x2="255" y2="445" stroke="#9CA9BD" stroke-width="1.5"/>
    <text x="255" y="458" text-anchor="middle">40</text>

    <line x1="353" y1="435" x2="353" y2="445" stroke="#9CA9BD" stroke-width="1.5"/>
    <text x="353" y="458" text-anchor="middle">60</text>

    <line x1="450" y1="435" x2="450" y2="445" stroke="#9CA9BD" stroke-width="1.5"/>
    <text x="450" y="458" text-anchor="middle">80</text>

    <line x1="548" y1="435" x2="548" y2="445" stroke="#9CA9BD" stroke-width="1.5"/>
    <text x="548" y="458" text-anchor="middle">100</text>

    <line x1="646" y1="435" x2="646" y2="445" stroke="#9CA9BD" stroke-width="1.5"/>
    <text x="646" y="458" text-anchor="middle">120</text>

    <line x1="743" y1="435" x2="743" y2="445" stroke="#9CA9BD" stroke-width="1.5"/>
    <text x="743" y="458" text-anchor="middle">140</text>

    <line x1="840" y1="435" x2="840" y2="445" stroke="#9CA9BD" stroke-width="1.5"/>
    <text x="840" y="458" text-anchor="middle">160</text>
  </g>
  <text x="860" y="444" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA9BD">ms</text>

  <!-- minor grid lines (vertical) -->
  <g stroke="#2D3548" stroke-width="0.5" stroke-dasharray="4,4">
    <line x1="157" y1="60" x2="157" y2="430"/>
    <line x1="255" y1="60" x2="255" y2="430"/>
    <line x1="353" y1="60" x2="353" y2="430"/>
    <line x1="450" y1="60" x2="450" y2="430"/>
    <line x1="548" y1="60" x2="548" y2="430"/>
    <line x1="646" y1="60" x2="646" y2="430"/>
    <line x1="743" y1="60" x2="743" y2="430"/>
  </g>

  <!-- ====== SECTION: Layer N ====== -->
  <text x="30" y="90" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="700" fill="#F5F0E8">Layer N</text>

  <!-- FWD All-Gather: 0-20ms -->
  <rect x="60" y="70" width="97" height="50" rx="4" fill="#9CA9BD"/>
  <text x="108" y="92" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#1A1F2E">FWD All-Gather</text>
  <text x="108" y="110" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1A1F2E">0-20ms</text>

  <!-- FWD Compute: 20-60ms -->
  <rect x="157" y="70" width="196" height="50" rx="4" fill="#6B7280"/>
  <text x="255" y="92" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#F5F0E8">FWD Compute</text>
  <text x="255" y="110" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C8C8C8">20-60ms</text>

  <!-- BWD All-Gather: 60-80ms -->
  <rect x="353" y="70" width="97" height="50" rx="4" fill="#9CA9BD"/>
  <text x="401" y="92" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#1A1F2E">BWD All-Gather</text>
  <text x="401" y="110" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1A1F2E">60-80ms</text>

  <!-- BWD Compute: 80-120ms -->
  <rect x="450" y="70" width="196" height="50" rx="4" fill="#6B7280"/>
  <text x="548" y="92" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#F5F0E8">BWD Compute</text>
  <text x="548" y="110" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C8C8C8">80-120ms</text>

  <!-- Reduce-Scatter: 120-140ms -->
  <rect x="646" y="70" width="97" height="50" rx="4" fill="#E04E3D"/>
  <text x="694" y="92" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#F5F0E8">Reduce-Scatter</text>
  <text x="694" y="110" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFD0C0">120-140ms</text>

  <!-- ====== SECTION: Layer N+1 (prefetch overlap, semi-transparent + dashed) ====== -->
  <text x="30" y="180" font-family="'Noto Sans SC', sans-serif" font-size="13" font-weight="700" fill="#9CA9BD">Layer N+1（Prefetch 隐藏）</text>

  <!-- FWD All-Gather: 20-40ms (dashed border) -->
  <rect x="157" y="160" width="97" height="50" rx="4" fill="#9CA9BD" fill-opacity="0.45" stroke="#9CA9BD" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="205" y="182" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#6B7280">FWD All-Gather</text>
  <text x="205" y="200" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9CA9BD">20-40ms</text>

  <!-- FWD Compute: 40-80ms -->
  <rect x="255" y="160" width="195" height="50" rx="4" fill="#6B7280" fill-opacity="0.45" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="353" y="182" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#9CA9BD">FWD Compute</text>
  <text x="353" y="200" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9CA9BD">40-80ms</text>

  <!-- BWD All-Gather: 80-100ms -->
  <rect x="450" y="160" width="97" height="50" rx="4" fill="#9CA9BD" fill-opacity="0.45" stroke="#9CA9BD" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="498" y="182" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#6B7280">BWD All-Gather</text>
  <text x="498" y="200" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9CA9BD">80-100ms</text>

  <!-- BWD Compute: 100-140ms -->
  <rect x="548" y="160" width="195" height="50" rx="4" fill="#6B7280" fill-opacity="0.45" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="646" y="182" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#9CA9BD">BWD Compute</text>
  <text x="646" y="200" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9CA9BD">100-140ms</text>

  <!-- Reduce-Scatter: 140-160ms -->
  <rect x="743" y="160" width="97" height="50" rx="4" fill="#E04E3D" fill-opacity="0.45" stroke="#E04E3D" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="791" y="182" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" font-weight="700" fill="#B05050">Reduce-Scatter</text>
  <text x="791" y="200" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#B05050">140-160ms</text>

  <!-- ====== LEGEND ====== -->
  <rect x="60" y="240" width="16" height="12" rx="2" fill="#9CA9BD"/>
  <text x="82" y="250" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#9CA9BD">All-Gather（通信）</text>

  <rect x="220" y="240" width="16" height="12" rx="2" fill="#6B7280"/>
  <text x="242" y="250" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#9CA9BD">FWD/BWD Compute（计算）</text>

  <rect x="420" y="240" width="16" height="12" rx="2" fill="#E04E3D"/>
  <text x="442" y="250" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#9CA9BD">Reduce-Scatter（通信）</text>

  <rect x="600" y="240" width="16" height="12" rx="2" fill="#E04E3D" fill-opacity="0.45" stroke="#E04E3D" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="622" y="250" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#9CA9BD">Prefetch 隐藏（重叠执行）</text>

  <!-- ====== BOTTOM NOTE ====== -->
  <rect x="0" y="400" width="900" height="100" fill="#2D3548"/>
  <text x="450" y="424" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="13" fill="#E04E3D" font-weight="700">
    总通信量 3Ψ · prefetch 可隐藏大部分延迟
  </text>
  <text x="450" y="448" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="12" fill="#9CA9BD">
    Layer N+1 的 All-Gather 与 Layer N 的 Compute 重叠 → 通信隐藏
  </text>
  <text x="450" y="470" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6B7280">
    1 iter = FWD(20ms) + BWD(20ms) + RS(20ms) = 60ms 理论通信 · 实际被 compute 覆盖
  </text>
</svg>
