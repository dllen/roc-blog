# The URL the site will be built for
base_url = "https://scp.net.cn"

# The site title and description; used in feeds by default.
title = "码农的自留地"
description = "语法 语义 语用"

# When set to "true", the generated HTML files are minified.
minify_html = true

# When set to "true", a sitemap is automatically generated.
generate_sitemap = true

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[search]
include_title = true
include_description = true
include_date = true
include_path = false
include_content = true
truncate_content_length = 500
index_format = "fuse_json"

[markdown]
lazy_async_image = true
# When set to "true", emoji aliases translated to their corresponding
# Unicode emoji equivalent in the rendered Markdown files. (e.g.: :smile: => 😄)
render_emoji = true

# Whether smart punctuation is enabled (changing quotes, dashes, dots in their typographic form)
# For example, `...` into `…`, `"quote"` into `“curly”` etc
smart_punctuation = true

[markdown.highlighting]
theme = "nord"

[link_checker]
internal_level = "warn"

[[taxonomies]]
name = "tags"

generate_feeds = true
feed_limit = 20

[extra]
homepage_title = "码农的自留地"
homepage_subtitle = "Less is more!"
# homepage_img_url = "/homepage-img.jpg"
homepage_img_url = "/index-image.png"

homepage_latest_limit = 10

nav_sections = [
  { name = "Spring 源码",  url = "/blog/spring/" },
  { name = "Redis",        url = "/blog/redis/" },
  { name = "Kafka",        url = "/blog/kafka/" },
  { name = "Flink",        url = "/blog/flink/" },
  { name = "ZooKeeper",    url = "/blog/zookeeper/" },
  { name = "HBase",        url = "/blog/hbase/" },
  { name = "HDFS",         url = "/blog/hdfs/" },
  { name = "翻译",         url = "/blog/translate/" },
  { name = "演讲",         url = "/blog/speech/" },
  { name = "阅读",         url = "/blog/reading/" },
  { name = "SRE",          url = "/blog/sre/" },
  { name = "Prompt",       url = "/blog/prompt/" },
  { name = "Weekly",       url = "/blog/weekly/" },
  { name = "Tutorial",     url = "/blog/tutorial/" },
]

# Refer https://support.google.com/analytics/answer/9539598?hl=en
