{% extends "base.html" %}

{% block head_extend %}
    <title>404 | {{ config.title }}</title>
{% endblock head_extend %}

{% block content %}
    <div class="listing-shell error-page">
        <p class="eyebrow">Page not found</p>
        <h1 class="error-page__code">404</h1>
        <p class="error-page__message">这个页面不存在，或已经移动到别处。</p>
        <a href="/" class="error-page__home" aria-label="返回首页">
            <i class="las la-home" aria-hidden="true"></i>
            <span>返回首页</span>
        </a>
    </div>
{% endblock content %}
