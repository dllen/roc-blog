name: Build Site

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: boring
        run: |
          corepack enable
          yarn install

      - name: Setup Python (for fonttools)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fonttools + brotli
        run: pip install fonttools==4.47.0 brotli==1.1.0

      - name: Build subset fonts
        working-directory: boring
        run: bash scripts/build-fonts.sh

      - name: Build CSS with PostCSS (yarn build)
        working-directory: boring
        run: yarn build

      - name: Run tests
        working-directory: boring
        run: yarn test

      - name: Audit frontmatter
        working-directory: boring
        run: node scripts/audit-frontmatter.mjs content/blog --out _audit
        continue-on-error: true
        id: audit

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontmatter-audit
          path: boring/_audit/frontmatter-audit.md

      - name: Comment on PR (audit results)
        if: github.event_name == 'pull_request' && steps.audit.outcome == 'failure'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: frontmatter-audit
          path: boring/_audit/frontmatter-audit.md

      - name: Generate OG images
        working-directory: boring
        run: node scripts/og-generator.mjs content/blog --out static/og

      - name: Cleanup orphan OG images
        working-directory: boring
        run: node scripts/cleanup-og.mjs content/blog --out static/og

      - name: Download Zola binary
        run: |
          ZOLA_VERSION="v0.19.2"
          curl -sSL -o zola.tar.gz "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/zola
          zola --version

      - name: Build site with Zola
        working-directory: boring
        run: zola build -o roc-blog --force

      - name: Test rendered site contracts
        working-directory: boring
        run: yarn test:site

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: boring/roc-blog

      - name: Deploy to release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: boring/roc-blog
          force_orphan: true